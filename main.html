<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home page</title>
    <!-- Daisy UI + Tailwind CSS Integration  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Awesome Font Integration -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Geist Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Adding Font Style -->
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <header> 
      <div class="navbar bg-base-100 shadow-sm px-5">
        <div class="flex-1">
          <div class="flex items-center gap-2">
            <img class="max-w-[36px]" src="assets/github-logo.png" alt="" />
            <h2 class="text-xl font-semibold">GitHub Issues Tracker</h2>
          </div>
        </div>
        <div class="flex gap-2">
          <div class="input">
            <i class="fa-brands fa-sistrix"></i>
            <input
            type="text"
            placeholder="Search"
            class="border-0 w-24 md:w-auto"
          />
          </div>
          <div>
            <button class="btn btn-primary w-max">+ New Issue</button>
          </div>
        </div>
      </div>
    </header>

    <main>
        
    </main>
    <script src="scripts/main.js"></script>
  </body>
</html>
