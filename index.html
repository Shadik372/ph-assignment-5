<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issue Tracker</title>

    <!-- Daisy UI + Tailwind CSS Integration  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Awesome Font Integration -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Geist Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Adding Font Style -->
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="flex flex-col justify-center items-center gap-2">
        <img src="assets/github-logo.png" alt="" />
        <h1 class="text-3xl">GitHub Issues Tracker</h1>
        <p class="text-[#D9D9D9]">Sign in to manage your issues</p>
      </div>

      <div class="login flex justify-center items-center mt-6">
        <fieldset class="fieldset w-xs p-4">
          <div class="mb-3">
            <label class="label text-[16px] text-[black]">Username</label>
            <input id="username-field" type="email" class="input" placeholder="Enter Username" />
            <label class="text-primary">Default: admin <span id="incorrect-name" class="text-red-600"></span></label>
          </div>

          <div class="mb-3">
            <label class="label text-[16px] text-[black]">Password</label>
            <input id="password-field" type="password" class="input" placeholder="Enter Password"/>
            <label class="text-primary">Default: admin123 <span id="incorrect-pass" class="text-red-600"></span></label>
          </div>

          <button id="login-btn" class="btn btn-primary mt-4">Sign In</button>
          <div class="divider text-slate-700 font-medium">OR</div>
          <div class="login-info">
          <h2 class="text-center">Demo Credentials</h2>
          <div class="bg-[#F8FAFC] p-5 text-[16px] text-center">
            <p>Username: admin</p>
            <p>Password: admin123</p>
          </div>
        </div>
        </fieldset>
      </div>
    </header>
    <script src="scripts/index.js"></script>
  </body>
</html>
